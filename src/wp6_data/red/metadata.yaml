# Device descriptions say *where* the thing hangs, because that is what a
# reading's meaning turns on and what a page can usefully caption. The location
# letters are those of `static/red/sensor_locations.docx`, which the home page
# offers for download, so a caption can be traced back to the floor plan.
devices:
  "s2100-01-par":
    description: "Above the lamps, at the top of the greenhouse above the screens (location D)"
    position: "B"
    type: "s2100"
    sensors:
      par:
        intention: "Measures PAR above grow lamp"

  "s2100-02-par":
    description: "At canopy level under the lamps, on the sensor rig mid-greenhouse (location B)"
    position: "B"
    type: "s2100"
    sensors:
      par:
        intention: "Measures PAR at plant height"

  # ── Multi-height wires: 4 measurements × 5 heights, plus radiation ──
  # Each height is its own device (`<wire>-h<n>`), served from the wide
  # wire_sensors table (see red ADR 0001). Which wires exist is NOT declared
  # here: upstream's wire_sensor_map is the source of truth (see red/wires.py),
  # so these patterns only describe whatever wire it lists. All wires share
  # position "B" until WP1 says otherwise (CONTEXT, open questions).
  # The "-h0" device is the solar-radiation sensor hanging above H1: one per
  # wire, so it reports `rad` alone and no growth section maps onto it.
  "WS_*-h0":
    description: "Multi-height wire — solar radiation, above H1"
    position: "B"
    type: "wire"
    sensors:
      rad: {}

  "WS_*-h[1-5]":
    description: "Multi-height wire — one height"
    position: "B"
    type: "wire"
    sensors:
      par: {}
      temp: {}
      hum: {}
      co2: {}

  "s2101-01-temp-hum":
    description: "Top of the greenhouse, above the screens (location D)"
    position: "B"
    type: "s2101"

  "s2103-01-temp-hum-co2":
    description: "On the greenhouse structure at plant top level (location A)"
    position: "B"
    type: "s2103"

  "s2107-01-temp":
    position: "B"
    type: "s2107"

  "s31-lb-01":
    position: "B"
    type: "s31"

  "s1000-wetherstation":
    position: "B"
    type: "s1000"

  "dendro-01":
    position: "B"
    type: "dendro"

  "dendro-02":
    position: "B"
    type: "dendro"

  "lht65n-e5":
    position: "B"
    type: "lht65n"

  "lht65s-e5-02":
    position: "B"
    type: "lht65s"

  "lht65s-ne117":
    position: "B"
    type: "lht65s"

  "lht65s-ne117-02":
    position: "B"
    type: "lht65s"

  "lht65s-ne117-03":
    position: "B"
    type: "lht65s"

  # ── Sijia / Neurath manual measurement plants (one device per cultivar+row) ──
  "neurath-B-2034-strabelina":
    description: "Strabelina cultivar at row 2034"
    position: "B"
    source: "sijia"

  "neurath-B-2012-shivious":
    description: "Shivious cultivar at row 2012"
    position: "B"
    source: "sijia"

  # ── LetsGrow modules (one device per LetsGrow screen) ──
  # Each lists its own sensors: a module measures only its handful of the
  # `letsgrow` tags, unlike a Sijia plant, which carries every Sijia tag.
  "letsgrow-climate-b4":
    description: "LetsGrow module 'Climate B4' — greenhouse climate, heating pipes, vents and screens of section B4"
    position: "B"
    type: "letsgrow"
    source: "letsgrow"
    sensors:
      lg_temp_greenhouse: {}
      lg_rh_greenhouse: {}
      lg_abs_hum_greenhouse: {}
      lg_hum_deficit_greenhouse: {}
      lg_vpd: {}
      lg_par: {}
      lg_par_sum: {}
      lg_co2: {}
      lg_co2_kg: {}
      lg_heating_setpoint: {}
      lg_pipe_lower: {}
      lg_pipe_lower_calc: {}
      lg_pipe_growth: {}
      lg_pipe_growth_calc: {}
      lg_vent_lee: {}
