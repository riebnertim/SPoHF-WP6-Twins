{{- if .Values.grey.enabled }}
{{- $greyImage := .Values.grey.image.repository | default (printf "%s-grey" .Values.image.repository) }}
{{- $greyTag := .Values.grey.image.tag | default .Values.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-grey-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-grey-dashboard
    dash0.com/enable: "true"
spec:
  replicas: {{ .Values.grey.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-grey-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-grey-dashboard
        dash0.com/enable: "true"
    spec:
      containers:
        - name: dashboard
          image: "{{ $greyImage }}:{{ $greyTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          resources:
            {{- toYaml .Values.grey.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-grey-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-grey-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-grey-dashboard
{{- if .Values.grey.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-grey-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-grey-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.grey.ingress.host }}
      secretName: {{ .Chart.Name }}-grey-dashboard-tls
  rules:
    - host: {{ .Values.grey.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-grey-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
