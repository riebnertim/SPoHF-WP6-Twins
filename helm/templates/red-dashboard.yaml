{{- if .Values.red.enabled }}
{{- $redImage := .Values.red.image.repository | default (printf "%s-red" .Values.image.repository) }}
{{- $redTag := .Values.red.image.tag | default .Values.image.tag }}
{{- $redSecret := .Values.red.secrets.existingSecret | default (printf "%s-red-secrets" .Chart.Name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-red-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
    dash0.com/enable: "true"
spec:
  replicas: {{ .Values.red.replicas }}
  # RollingUpdate: this pod mounts no ReadWriteOnce PVCs at all any more, so two
  # generations can coexist and the new one must pass its readiness probe before
  # the old one is torn down. That is the whole point of issue 061 — a deploy
  # used to be a full outage because a block volume attaches to exactly one node,
  # which made `Recreate` the only strategy that could complete.
  #
  # maxUnavailable 0 / maxSurge 1, explicitly: the defaults (25%) round to 0 surge
  # at one replica, which would silently keep the old behaviour.
  #
  # Two pods therefore overlap briefly, and both carry the nightly retrain
  # schedule. That is safe: a concurrent PUT to one key was measured against the
  # real store to give clean last-writer-wins, never a torn object — which is
  # strictly better than the `open(path,'wb')` this replaced.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
        dash0.com/enable: "true"
    spec:
      containers:
        - name: dashboard
          image: "{{ $redImage }}:{{ $redTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WP6_RED_DB_HOST
              value: {{ .Values.red.mysql.host | quote }}
            - name: WP6_RED_DB_PORT
              value: {{ .Values.red.mysql.port | quote }}
            - name: WP6_RED_DB_NAME
              value: {{ .Values.red.mysql.database | quote }}
            - name: WP6_RED_DB_USER
              value: {{ .Values.red.mysql.user | quote }}
            - name: WP6_RED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redSecret }}
                  key: mysql-password
            - name: WP6_RED_TSDB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $redSecret }}
                  key: tsdb-url
            - name: WP6_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: oidc-client-secret
            - name: WP6_OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Chart.Name) }}
                  key: oidc-session-secret
            - name: WP6_OIDC_REDIRECT_BASE
              value: {{ printf "https://%s" .Values.red.ingress.host | quote }}
            {{- include "wp6-data.objectStoreEnv" (dict "root" $) | nindent 12 }}
            # Models live under red/models/ in the object store, so a deploy
            # reads them back instead of refitting. Keys are chosen in code
            # (red/deps.py), not configured here.
            # Refit on a clock, so persisting them doesn't freeze them.
            - name: WP6_RED_RETRAIN_AT
              value: {{ .Values.red.retrainAt | quote }}
          resources:
            {{- toYaml .Values.red.resources | nindent 12 }}
          # Keep serving for a moment after SIGTERM, so Traefik has time to drop
          # this pod from its endpoint list before the process stops accepting.
          #
          # Measured: the first rolling deploy (v1.0.469) served every request to
          # red but returned a single 502 on blue, and the pod's own readiness
          # probe recorded `connection refused` at the same instant — the process
          # was gone while the ingress still routed to it. Endpoint removal and
          # container shutdown are concurrent, and nothing orders them.
          #
          # 5s is comfortably longer than a Traefik endpoint update and well
          # inside terminationGracePeriodSeconds (30), so it costs a few seconds
          # of rollout and nothing else.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 18
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-red-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
{{- if .Values.red.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-red-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-red-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.red.ingress.host }}
      secretName: {{ .Chart.Name }}-red-dashboard-tls
  rules:
    - host: {{ .Values.red.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-red-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
