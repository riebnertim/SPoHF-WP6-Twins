# WP6 Shared Infrastructure - TimescaleDB and sync jobs
# Deployed as a separate ArgoCD app to avoid shared resource ownership conflicts

image:
  repository: ""  # Required: e.g., harbor.example.com/spohf/wp6-data-blue
  pullPolicy: Always
  tag: "latest"

# TimescaleDB (shared by blue and red twins)
timescaledb:
  enabled: true
  # PGDATA location. Empty → image default (the mount root), which is correct for
  # local-path volumes and for any EXISTING instance whose data already sits at the
  # root (e.g. the legacy cluster — do not change it there). Set to a subdirectory
  # of the data mount for a block-device PVC (ext4/cloudstack-csi), whose lost+found
  # otherwise makes initdb refuse the "not empty" mount root. Opt in per-cluster via
  # the wp6-data-shared Application's helm parameters, not here.
  pgData: ""

# SPoHF datalake sync CronJob (the single automated source)
sync:
  enabled: true
  schedule: "*/15 * * * *"
  pageSize: 1000
  endpoints: "yookr-data"
  mode: "incremental"  # "full" or "incremental"
  windowDays: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# LetsGrow sync CronJob → red's database (wp6_red). LetsGrow is delivered once
# a day (data up to local midnight, relayed the next morning), so hourly is
# plenty. Incremental mode re-reads the last days each run; a historical
# backfill is a one-off Job with mode "full" (and WP6_SYNC_START/END).
letsgrowSync:
  enabled: true
  schedule: "40 * * * *"
  pageSize: 1000
  mode: "incremental"  # "full" or "incremental"
  windowDays: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

# SPoHF API
api:
  baseUrl: "https://backoffice.spohf.com"

# Secrets (referenced from ExternalSecret or direct)
secrets:
  existingSecret: ""  # Name of existing secret (default: wp6-data-secrets)
  # Blue-twin-specific secret holding tsdb-url for the wp6_blue database.
  # Separate from the shared secret so red can have a symmetric red-secrets.
  blueSecret: ""  # Name of blue secret (default: wp6-data-blue-secrets)
  # Red-twin secret holding tsdb-url for the wp6_red database (LetsGrow sync).
  # The same secret the red dashboard reads.
  redSecret: ""  # Name of red secret (default: wp6-data-red-secrets)
